name: Keep Render instance warm

on:
  schedule:
    # Render free tier spins down after 15 minutes of inactivity.
    # GitHub cron can lag several minutes, so ping every 10.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://strongpass-generator.onrender.com/api/password/health)
          echo "Health check returned HTTP $response"
          if [ "$response" -ge 500 ]; then
            echo "Service is unhealthy" >&2
            exit 1
          fi
