version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: StrongPassWordGenerator.Server/Dockerfile
    container_name: strongpass-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - strongpass-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/password/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strongpass-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - strongpass-network
    restart: unless-stopped

networks:
  strongpass-network:
    driver: bridge
